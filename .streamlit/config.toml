[client]
# This is the reliable, version-proof way to hide the "Deploy" button and
# hamburger menu — CSS selectors for it change between Streamlit releases,
# this setting doesn't.
toolbarMode = "minimal"

[theme]
primaryColor = "#2FBF96"
backgroundColor = "#E8F8F0"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A2B25"
font = "sans serif"